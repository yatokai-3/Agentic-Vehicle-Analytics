[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#101828"
textColor = "#e7edf7"
borderColor = "#1f2b42"
linkColor = "#8b5cf6"
codeBackgroundColor = "#0c1220"
codeTextColor = "#7ce7c9"
font = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0a0f1a"
borderColor = "#1f2b42"
